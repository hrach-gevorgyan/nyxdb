name: Release

# Publishes a GitHub Release for every version that has both a tag (vX.Y.Z)
# and release notes (doc/releases/vX.Y.Z.md) but no release yet. Runs when
# notes are pushed to master or a version tag is pushed, so either order
# works: tag first then notes, or notes first then tag. Uses the workflow's
# own token; nothing outside GitHub needs credentials.

on:
  push:
    branches: [master]
    paths: ["doc/releases/**"]
    tags: ["v*"]

# Creating a release writes to the repo; nothing else does.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Publish releases that have a tag and notes but no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for notes in doc/releases/v*.md; do
            tag=$(basename "$notes" .md)
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag: no tag yet, skipping"
              continue
            fi
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag: already released"
              continue
            fi
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"
            echo "$tag: released"
          done
