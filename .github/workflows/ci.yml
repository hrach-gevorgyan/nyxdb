name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least-privilege default: this workflow only checks out code and runs
# tests, never writes to the repo, comments on PRs, or publishes
# packages. Without this, GITHUB_TOKEN defaults to broad read/write
# permissions for every job (flagged by CodeQL).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags: the upgrade test builds the previous release (v0.1.7).
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the PouchDB clients (8.x and 9.x)
        run: npm install --prefix test/integration

      # Release build (zero warnings), clippy, unit tests, every suite
      # against a scratch server, then the PouchDB-driven suites on 9.x.
      # The same command runs it locally; see test/README.md.
      - name: Full regression
        run: node test/run_all.js

    # Differential and benchmark tests need a real CouchDB instance and
    # aren't run in CI — they're for local verification against a real
    # server (see test/README.md), not regression-gating every push.
